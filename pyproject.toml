[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SilKit_py_scenario_runner"
version = "0.1.0"
description = "ECU-independent scenario scheduling and automated testing for SIL Kit Python participants"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE"]

keywords = [
    "silkit",
    "simulation",
    "automotive",
    "pytest",
    "scenario-runner",
]

dependencies = [
    "SilKit_py>=1.0.4",
]

[project.urls]
Homepage = "https://github.com/JannisRln/SilKit_py_scenario_runner"
Repository = "https://github.com/JannisRln/SilKit_py_scenario_runner"
Issues = "https://github.com/JannisRln/SilKit_py_scenario_runner/issues"

[project.optional-dependencies]
test = ["pytest>=8"]